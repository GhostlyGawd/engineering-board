name: pages

# Build an allowlisted site and regenerate the current board with GitHub source links.
# Keep branch publication: this repository's token cannot manage the Pages API.

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/guide.html"
      - "docs/site.css"
      - "docs/site.js"
      - "docs/example/**"
      - "brand/**"
      - "scripts/build-site.py"
      - "hooks/scripts/**"
      - "references/demo/pattern-intelligence/**"
      - "engineering-board/BOARD-ROUTER.md"
      - "docs/assets/**"
      - "docs/.nojekyll"
      - "docs/llms.txt"
      - "engineering-board/eb-self/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish docs/ to gh-pages
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short HEAD)
          SITE=$(mktemp -d)
          python3 scripts/build-site.py --output "$SITE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rfq .
          git clean -fdq
          cp -r "$SITE"/. .
          git add -A
          git commit -m "pages: publish docs/ from main@${SHA}"
          git push origin +gh-pages
