name: pages

# Pages publication is an explicit protected-main operation. The job renders
# eb-self from canonical Markdown at the checked-out source SHA, then advances
# the existing gh-pages history without force-pushing it. The generated board
# is never trusted from a different revision.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://ghostlygawd.github.io/engineering-board/
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate canonical Pages site
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "${SOURCE_SHA}" = "${GITHUB_SHA}"
          SITE=$(mktemp -d)
          cp -r docs/index.html docs/assets docs/.nojekyll docs/llms.txt "$SITE"/
          CLAUDE_PROJECT_DIR="${GITHUB_WORKSPACE}" \
            bash hooks/scripts/board-view.sh eb-self --stdout \
              --stamp --revision "${SOURCE_SHA}" \
              --link-base "https://github.com/GhostlyGawd/engineering-board/blob/${SOURCE_SHA}/engineering-board/eb-self/" \
              >"${SITE}/board.html"
          BOARD_SHA256="$(sha256sum "${SITE}/board.html" | cut -d' ' -f1)"
          printf 'pages-provenance source_sha=%s board_sha256=%s\n' \
            "${SOURCE_SHA}" "${BOARD_SHA256}"

          git fetch --no-tags origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git rm -rfq --ignore-unmatch .
          cp -r "${SITE}"/. .
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "pages: publish protected main@${SOURCE_SHA}"
          git push origin HEAD:gh-pages
