name: tests

# v0.3.2 CI gate — runs the full engineering-board test suite on every push
# and pull-request. Mirrors what `bash tests/run-all.sh` runs locally.
#
# The runner owns the current suite manifest. This workflow does not duplicate
# the suite count because the count changes as product gates are added.
#
# Required toolchain (preinstalled on ubuntu-latest):
#   - bash (POSIX-compatible; scripts use #!/usr/bin/env bash)
#   - python3 (date math, JSON parsing, SHA256, atomic file ops)
#   - mkdir/mv/rm/grep/awk/sed (POSIX coreutils)
#
# No external dependencies. No package install step needed.

on:
  push:
  pull_request:

jobs:
  test:
    name: run-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The Milestone D.1 harness loads the product core from the pinned
          # v1.11.0 commit. A one-commit checkout cannot verify that source.
          fetch-depth: 0

      - name: Show toolchain versions
        run: |
          bash --version | head -1
          python3 --version

      - name: Run full test suite
        run: bash tests/run-all.sh
