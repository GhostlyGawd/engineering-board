name: tests

# v0.3.2 CI gate — runs the full engineering-board test suite on main pushes
# and pull requests. Mirrors what `bash tests/run-all.sh` runs locally.
#
# The runner owns the current suite manifest. This workflow does not duplicate
# the suite count because the count changes as product gates are added.
#
# Required toolchain (preinstalled on ubuntu-latest):
#   - bash (POSIX-compatible; scripts use #!/usr/bin/env bash)
#   - python3 (date math, JSON parsing, SHA256, atomic file ops)
#   - mkdir/mv/rm/grep/awk/sed (POSIX coreutils)
#
# No external dependencies. No package install step needed.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  test:
    name: run-all
    runs-on: ubuntu-24.04
    env:
      ENGINEERING_BOARD_SUPPORT_ROW: linux-x86_64-bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The Milestone D.1 harness loads the product core from the pinned
          # v1.11.0 commit. A one-commit checkout cannot verify that source.
          fetch-depth: 0

      - name: Show toolchain versions
        run: |
          bash --version | head -1
          python3 --version

      - name: Provision pinned development tools
        run: bash scripts/bootstrap-dev.sh

      - name: Verify pinned development tools offline
        env:
          UV_OFFLINE: "1"
          npm_config_offline: "true"
        run: bash scripts/bootstrap-dev.sh --check

      - name: Run full test suite
        run: >-
          python3 scripts/aggregate_ci_evidence.py
          --output .engineering-board/validation/aggregate/run-all.json

      - name: Retain exact-head aggregate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aggregate-result-linux-x86_64-bash
          path: .engineering-board/validation/aggregate/run-all.json
          if-no-files-found: error
          retention-days: 30
