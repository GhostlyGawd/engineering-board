  <text x="54" y="105" fill="#A5AAB3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">$ bash tests/orchestration/milestone-d-context-outcome-intelligence.sh</text>
  <text x="54" y="148" fill="#D0D6E0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20">Milestone D context and outcome intelligence matrix: 15 checks passed</text>

  <text x="54" y="210" fill="#F7F8F8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">before a fix</text>
  <text x="260" y="210" fill="#F7F8F8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">task + path + entry → title + typed summary + epistemic state</text>

  <text x="54" y="254" fill="#F7F8F8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">why it surfaced</text>
  <text x="260" y="254" fill="#F7F8F8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">pattern · path · graph distance · intent · outcome</text>

  <text x="54" y="298" fill="#F7F8F8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">after a fix</text>
  <text x="260" y="298" fill="#F7F8F8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">held / failed / partial / inconclusive → H### history</text>

  <text x="54" y="342" fill="#F7F8F8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">memory update</text>
  <text x="260" y="342" fill="#F7F8F8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">supported / weakened / contested / untested → L###</text>

  <text x="54" y="386" fill="#F7F8F8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">authority</text>
  <text x="260" y="386" fill="#F7F8F8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">automatic reads · explicit content-bound writes</text>

  <text x="54" y="448" fill="#D0D6E0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">shared core == command == MCP context output</text>
  <text x="54" y="484" fill="#D0D6E0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">repeat retrieval is equal · lexical decoy returns no result · preview writes 0 files</text>
  <text x="54" y="520" fill="#D0D6E0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">repeated apply is idempotent · failed fix makes Learning contested</text>
  <text x="54" y="556" fill="#D0D6E0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">cache deletion preserves results · value report excludes prompt and session counts</text>

