      <text x="18" y="158" fill="#ECEBE6">B002</text>
      <rect x="0" y="220" width="88" height="64" rx="10" fill="#24272D" stroke="#3A3E47"/>
      <text x="18" y="258" fill="#ECEBE6">B003</text>

      <rect x="212" y="130" width="96" height="92" rx="14" fill="#E6A94E"/>
