    </g>
  </g>

  <!-- right-side pattern graph: three symptoms converge on one cluster and bounded hypothesis -->
  <g transform="translate(700,112)">
    <path d="M86 52 C 150 52, 156 176, 214 176" stroke="#5C626D" stroke-width="2" fill="none"/>
    <path d="M86 152 C 150 152, 156 176, 214 176" stroke="#5C626D" stroke-width="2" fill="none"/>
    <path d="M86 252 C 150 252, 156 176, 214 176" stroke="#5C626D" stroke-width="2" fill="none"/>
    <path d="M306 176 C 348 176, 354 332, 398 332" stroke="#E6A94E" stroke-width="2.5" stroke-dasharray="3 8" stroke-linecap="round" fill="none" opacity="0.75"/>

    <g class="h" font-size="16" font-weight="600">
      <rect x="0" y="20" width="88" height="64" rx="10" fill="#24272D" stroke="#3A3E47"/>
      <text x="18" y="58" fill="#ECEBE6">B001</text>
